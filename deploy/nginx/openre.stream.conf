## ═══════════════════════════════════════════════════════════════
## openre.stream — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openre.stream.conf — keep them in sync and reload
## nginx after changing it. Certificate: openre.stream is its own domain (not under the
## openvibe.network wildcard); issue one with certbot for openre.stream before enabling.
##
## openre-api (port 4500, unit openre-api) serves:
##   /                      the standalone UI (server-rendered; works without JavaScript)
##   /auth/*                OpenVibe.Network sign-in (OAuth client `openre`)
##   /api/v1/*              the API (service tokens or the owner's Network JWT on every route)
##   /api/health, /api/ready
##   /play/<session>.flv    HTTP-FLV playback of a live, non-private session (long-lived)
##
## RTMP does NOT go through nginx or Cloudflare: ingest.openre.stream is a DNS-only (grey cloud)
## A record to this host, and the rtmp-ingest workers listen on TCP 1936 themselves (README
## "Port plan"). Open 1936/tcp in the host firewall and at the provider edge.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=openre_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=openre_play:10m;

server {
    listen 80;
    listen [::]:80;
    server_name openre.stream www.openre.stream;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openre.stream$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openre.stream;
    ssl_certificate     /etc/letsencrypt/live/openre.stream/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openre.stream/privkey.pem;
    return 301 https://openre.stream$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openre.stream;

    ssl_certificate     /etc/letsencrypt/live/openre.stream/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openre.stream/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openre.stream.access.log;
    error_log  /var/log/nginx/openre.stream.error.log;

    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Live playback: no buffering, long reads. Viewers reconnect across an API deploy; the
    # ingest (a separate worker process) is never affected.
    location /play/ {
        limit_conn openre_play 8;
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 12h;
        send_timeout 12h;
    }

    location /api/ {
        limit_req zone=openre_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
    }

    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
