## REFERENCE (not installed): WHIP + WebRTC signaling over HTTPS at ingest.openre.stream.
## Opus installs this (or an equivalent) at the WebRTC cutover. It terminates TLS for
## `ingest.openre.stream` and proxies to the webrtc worker's public port (OPENRE_WEBRTC_PORT,
## default 9936): WHIP POST/PATCH/DELETE under /whip/* and the WS signalling endpoints /b/* and
## /w/*. The worker builds `Location: https://<host>/whip/session/<id>` from the request Host, so
## set proxy_set_header Host. The certificate must cover ingest.openre.stream. The RTC media itself
## does NOT go through nginx: it is UDP 10200-10300 straight to this host, so MEDIASOUP_ANNOUNCED_IP
## must be the public address and 10200-10300/udp must be open at the provider edge (grey-cloud DNS;
## Cloudflare's proxy cannot carry raw UDP WebRTC).
