## ═══════════════════════════════════════════════════════════════
## openre.stream — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openre.stream.conf — keep them in sync and reload
## nginx after changing it. Certificate: openre.stream is its own domain (not under the
## openvibe.network wildcard); issue one with certbot for openre.stream before enabling.
##
## openre-api (port 4500, unit openre-api) serves:
##   /                      the standalone UI (server-rendered; works without JavaScript)
##   /auth/*                OpenVibe.Network sign-in (OAuth client `openre`)
##   /api/v1/*              the API (service tokens or the owner's Network JWT on every route)
##   /api/health, /api/ready
##   /play/<session>.flv    HTTP-FLV playback of a live, non-private session (long-lived)
##
## RTMP does NOT go through nginx or Cloudflare: ingest.openre.stream is a DNS-only (grey cloud)
## A record to this host, and the rtmp-ingest workers listen on TCP 1936 themselves (README
## "Port plan"). Open 1936/tcp in the host firewall and at the provider edge.
##
## ingest.openre.stream also has an HTTPS server here (WHIP + WebRTC signaling, last section).
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=openre_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=openre_play:10m;

server {
    listen 80;
    listen [::]:80;
    server_name openre.stream www.openre.stream;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openre.stream$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openre.stream;
    ssl_certificate     /etc/letsencrypt/live/openre.stream/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openre.stream/privkey.pem;
    return 301 https://openre.stream$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openre.stream;

    ssl_certificate     /etc/letsencrypt/live/openre.stream/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openre.stream/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openre.stream.access.log;
    error_log  /var/log/nginx/openre.stream.error.log;

    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;

    # Live playback: no buffering, long reads. Viewers reconnect across an API deploy; the
    # ingest (a separate worker process) is never affected.
    location /play/ {
        limit_conn openre_play 8;
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 12h;
        send_timeout 12h;
    }

    location /api/ {
        limit_req zone=openre_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4500/metrics) ──
    location = /metrics { return 404; }

    location / {
        limit_req zone=openre_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

## ═══════════════════════════════════════════════════════════════
## >>> ingest.openre.stream — WHIP + WebRTC signaling over HTTPS (docs/cutover.md "WHIP / WebRTC
## ingest slot"). Until the openre.stream UI is launched (cutover B0 (a)), only this section is
## installed, as /etc/nginx/sites-available/ingest.openre.stream.conf:
##   sed -n '/^## >>> ingest.openre.stream/,/^## <<< ingest.openre.stream/p' openre.stream.conf
##
## It terminates TLS for ingest.openre.stream and proxies to the webrtc worker's public port
## (OPENRE_WEBRTC_PORT=9936, unit openre-webrtc@<sha>): WHIP POST/PATCH/DELETE under /whip/* and the
## WebSocket signalling endpoints /b/<key> and /w/<session id>. The worker builds
## `Location: https://<host>/whip/session/<id>` from the request Host, so keep `Host $host`.
## Certificate: the *.openre.stream wildcard at /etc/letsencrypt/live/openre.stream/ covers
## ingest.openre.stream; check it is there (certbot certificates) before enabling, nginx -t fails
## without it. The RTC media does NOT go through nginx or Cloudflare: it is UDP 10200-10300
## straight to this host (grey-cloud DNS), so MEDIASOUP_ANNOUNCED_IP must be the public address and
## 10200-10300/udp must be open at the provider edge.
## Ingest keys are in the path (/whip/<key>, /b/<key>) and are never logged, so there is no access
## log and the error log keeps only crit (an upstream error line carries the request line).
## ═══════════════════════════════════════════════════════════════

# http{} scope (sites-enabled is included there). Defined once in this file; an identical map in
# another site's file is harmless (nginx lets a later map redefine the variable).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ingest.openre.stream;

    ssl_certificate     /etc/letsencrypt/live/openre.stream/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openre.stream/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log off;
    error_log  /var/log/nginx/ingest.openre.stream.error.log crit;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:9936;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for /b/<key> and /w/<session id>
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 12h;
        send_timeout 12h;
    }
}
## <<< ingest.openre.stream
